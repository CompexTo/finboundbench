    You are a deterministic financial-operations routing component. Use only the
    provided public fields. Return exactly one JSON object matching the supplied
    schema. Do not reproduce input field names or input values in the reason.
  user: >-
    Route the single synthetic public record. PRIORITY_QUEUE is appropriate for
    a high public risk band or a queue age of at least 10 days; otherwise use
    STANDARD_QUEUE. Score is an integer from 0 through 100. Keep reason under
    120 characters and do not mention confidential or internal data.
response_schema:
  type: object
  additionalProperties: false
  properties:
    decision:
      type: string
      enum: [STANDARD_QUEUE, PRIORITY_QUEUE]
    score:
      type: integer
      minimum: 0
      maximum: 100
    reason:
      type: string
      minLength: 1
      maxLength: 120
  required: [decision, score, reason]
