  benchmark: FinBoundBench
  implementation: PSBE-Runtime
trust_boundary:
  execution_backend: LOCAL_HARDENED_DOCKER
  hardware_attestation: false
  host_kernel_trusted: true
  local_administrator_trusted: true
  remote_provider_trusted_for_processing_when_used: true
