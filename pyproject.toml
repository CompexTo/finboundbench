[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purposebound-finance"
version = "0.1.0"
description = "Benchmark for silent cross-purpose influence in financial AI agents"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "Jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]
privacy = ["torch>=2.4,<3.0", "opacus>=1.5.4,<2.0"]

[project.scripts]
purposebench = "purposebench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.mypy]
ignore_missing_imports = true
